[mod]
id = "cloudglass"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure colour-registry model (standalone crate lib, injected as
# `crate::game::cloudglass`). The blocks are declared in ../content; the tests
# pin the registry and the dye diffuse colours the content generator and the
# client overlay read.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "cloudglass"
source = "runtime.rs"

# Game-side glue: the client eye overlay (upstream `ClientTick.java:24-43`).
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "cloudglass_state"
source = "support.rs"

# The content half is inside this bundle (`data/cloudglass-content.hmod`, the
# built `content/cloudglass.hmod`): this writes it to `.horizon-cache/` and
# appends it to the dev-mod list, so one `.hnmod` installs the blocks and the
# code. The registry keeps one file per project, so a split port could not be
# listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# Before each vanilla HUD layer (API 139): tint the frame when the camera is
# inside a cloud-glass block.
[[injection]]
id = "gui-layer-pre"
hook = "gui_layer_pre"
hook_version = 1
kind = "HEAD"
helper = "gui_layer.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "layer", ty = "&str", value = "layer" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "batch" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]
